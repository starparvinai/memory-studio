[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-studio"
version = "0.1.0"
description = "Private, Immich-connected photo book drafts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "Pillow>=11,<13",
  "pillow-heif>=1.1,<2",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pypdf>=5,<7"]

[project.scripts]
memory-studio = "memory_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memory_studio = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
